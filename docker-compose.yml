services:
  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
      args:
        OPENSEARCH_VERSION: "3.6.0"
        IK_PLUGIN_URL: "https://get.infini.cloud/opensearch/analysis-ik/3.6.0"
    image: unified-api-opensearch-ik:3.6.0
    container_name: unified-api-opensearch
    environment:
      - cluster.name=unified-api-opensearch
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  opensearch-data:
