services:
  redis:
    image: redis:7-alpine
    container_name: unified-api-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
      args:
        OPENSEARCH_VERSION: "3.6.0"
        IK_PLUGIN_URL: "https://get.infini.cloud/opensearch/analysis-ik/3.6.0"
    image: unified-api-opensearch-ik:3.6.0
    container_name: unified-api-opensearch
    environment:
      - cluster.name=unified-api-opensearch
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9201:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  docx-mcp:
    build:
      context: .
      dockerfile: services/docker/docx_mcp/Dockerfile
    container_name: unified-api-docx-mcp
    ports:
      - "9100:9100"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/personal_uploads:/data/personal_uploads
    environment:
      - MCP_ALLOWED_DIR=/data/uploads,/data/personal_uploads
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  xlsx-mcp:
    build:
      context: .
      dockerfile: services/docker/xlsx_mcp/Dockerfile
    container_name: unified-api-xlsx-mcp
    ports:
      - "9101:9101"
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/personal_uploads:/data/personal_uploads
    environment:
      - MCP_ALLOWED_DIR=/data/uploads,/data/personal_uploads
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9101/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  opensearch-data:
